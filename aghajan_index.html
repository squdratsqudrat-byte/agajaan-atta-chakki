<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>اغا جان سائیکلون آٹا چکی</title>
<link rel="manifest" href="manifest.json">
<script src="https://cdn.jsdelivr.net/npm/quagga@0.12.1/dist/quagga.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --navy:#122a43;
    --navy2:#1c3f61;
    --amber:#e08a2c;
    --amber-dark:#c76f16;
    --cream:#fbf7f0;
    --card:#ffffff;
    --ink:#1a2430;
    --muted:#6b7684;
    --line:#e7e1d6;
    --green:#1f8a52;
    --red:#c0392b;
    --radius:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family: 'Segoe UI', Tahoma, 'Noto Sans Arabic', sans-serif;
    background:var(--cream);
    color:var(--ink);
    direction:rtl;
    overscroll-behavior-y: contain;
  }
  #app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--cream);}

  /* Header */
  header.topbar{
    background:linear-gradient(135deg,var(--navy),var(--navy2));
    color:#fff;padding:16px 18px 20px;
    position:sticky;top:0;z-index:20;
    box-shadow:0 4px 14px rgba(18,42,67,.25);
  }
  header.topbar .row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  header.topbar .brand{display:flex;align-items:center;gap:10px;}
  header.topbar .logo{width:38px;height:38px;flex:none;}
  header.topbar h1{font-size:17px;margin:0;font-weight:800;letter-spacing:.2px;}
  header.topbar .sub{font-size:11px;opacity:.75;margin-top:2px;}
  header.topbar .screenTitle{font-size:20px;font-weight:800;margin-top:10px;}
  .iconbtn{background:rgba(255,255,255,.14);border:none;color:#fff;border-radius:10px;width:38px;height:38px;font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .iconbtn:active{background:rgba(255,255,255,.28);}

  main{flex:1;padding:14px 14px 96px;overflow-y:auto;}

  /* Bottom nav */
  nav.bottomnav{
    position:fixed;bottom:0;left:50%;transform:translateX(-50%);
    width:100%;max-width:520px;background:#fff;
    border-top:1px solid var(--line);
    display:flex;justify-content:space-around;align-items:stretch;
    padding:6px 4px calc(6px + env(safe-area-inset-bottom));
    z-index:30; box-shadow:0 -4px 18px rgba(0,0,0,.06);
  }
  nav.bottomnav button{
    background:none;border:none;flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
    padding:6px 2px;color:var(--muted);font-size:10.5px;font-weight:600;cursor:pointer;border-radius:10px;
  }
  nav.bottomnav button .ic{font-size:20px;}
  nav.bottomnav button.active{color:var(--amber-dark);}
  nav.bottomnav button.active .ic{transform:translateY(-1px);}

  /* Cards & common */
  .card{background:var(--card);border-radius:var(--radius);padding:14px;margin-bottom:12px;box-shadow:0 2px 10px rgba(20,30,45,.06);border:1px solid var(--line);}
  .card h3{margin:0 0 10px;font-size:14px;color:var(--navy);}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .stat{background:var(--card);border-radius:var(--radius);padding:14px;border:1px solid var(--line);box-shadow:0 2px 10px rgba(20,30,45,.05);}
  .stat .label{font-size:11.5px;color:var(--muted);margin-bottom:6px;}
  .stat .value{font-size:19px;font-weight:800;color:var(--navy);}
  .stat.warn .value{color:var(--red);}
  .stat.good .value{color:var(--green);}

  label{display:block;font-size:12.5px;color:var(--muted);margin:10px 0 5px;font-weight:600;}
  input[type=text],input[type=number],input[type=date],input[type=tel],select,textarea{
    width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;font-size:15px;
    background:#fff;color:var(--ink);font-family:inherit;
  }
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--amber);}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 16px;border-radius:12px;border:none;font-size:14.5px;font-weight:700;cursor:pointer;width:100%;}
  .btn-primary{background:var(--amber);color:#fff;}
  .btn-primary:active{background:var(--amber-dark);}
  .btn-navy{background:var(--navy);color:#fff;}
  .btn-outline{background:#fff;border:1.5px solid var(--line);color:var(--navy);}
  .btn-green{background:var(--green);color:#fff;}
  .btn-red{background:var(--red);color:#fff;}
  .btn-sm{padding:8px 12px;font-size:13px;width:auto;}
  .btn-row{display:flex;gap:8px;}
  .seg{display:flex;background:#f1ede4;border-radius:12px;padding:4px;gap:4px;}
  .seg button{flex:1;padding:10px 6px;border:none;background:transparent;border-radius:9px;font-weight:700;font-size:13.5px;color:var(--muted);cursor:pointer;}
  .seg button.on{background:var(--navy);color:#fff;}
  .cattabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch;}
  .cattabs::-webkit-scrollbar{display:none;}
  .cattab{flex:0 0 auto;padding:8px 14px;border-radius:20px;border:1.5px solid var(--line);background:#fff;color:var(--navy);font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap;}
  .cattab.on{background:var(--navy);color:#fff;border-color:var(--navy);}
  .prodgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .prodcard{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:6px;text-align:center;cursor:pointer;position:relative;}
  .prodcard .qtybadge{position:absolute;top:-6px;left:-6px;background:var(--green);color:#fff;font-size:11px;font-weight:800;min-width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;padding:0 4px;box-shadow:0 1px 4px rgba(0,0,0,.25);}
  .prodcard.sel{border-color:var(--navy);box-shadow:0 0 0 2px rgba(18,42,67,.15);}
  .prodcard .ph{width:100%;aspect-ratio:1/1;border-radius:9px;object-fit:cover;background:#f1ede4;display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--muted);margin-bottom:5px;}
  .prodcard .pn{font-size:11.5px;font-weight:700;color:var(--navy);line-height:1.25;max-height:28px;overflow:hidden;}
  .prodcard .pp{font-size:11px;color:var(--muted);margin-top:2px;font-weight:700;}
  .wsmode{display:flex;align-items:center;justify-content:space-between;background:#fff4e8;border:1.5px solid #f0c36d;border-radius:12px;padding:10px 12px;margin-bottom:10px;}
  .wsmode .wl{display:flex;align-items:center;gap:8px;font-weight:800;color:#a45c00;font-size:14px;}
  .swtch{position:relative;display:inline-block;width:46px;height:26px;flex:none;}
  .swtch input{opacity:0;width:0;height:0;}
  .swtch .sl{position:absolute;cursor:pointer;inset:0;background:#d8d2c4;border-radius:26px;transition:.2s;}
  .swtch .sl:before{content:"";position:absolute;height:20px;width:20px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3);}
  .swtch input:checked + .sl{background:var(--green);}
  .swtch input:checked + .sl:before{transform:translateX(20px);}

  .list-item{display:flex;align-items:center;justify-content:space-between;padding:12px 4px;border-bottom:1px solid var(--line);}
  .list-item:last-child{border-bottom:none;}
  .list-item .name{font-weight:700;font-size:14.5px;}
  .list-item .meta{font-size:12px;color:var(--muted);margin-top:2px;}
  .badge{font-size:11px;padding:3px 9px;border-radius:20px;font-weight:700;}
  .badge.due{background:#fdecea;color:var(--red);}
  .badge.ok{background:#e9f7ef;color:var(--green);}
  .badge.low{background:#fff4e0;color:var(--amber-dark);}

  .searchbar{display:flex;gap:8px;margin-bottom:12px;}
  .searchbar input{flex:1;}

  .fab{
    position:fixed;left:18px;bottom:86px;z-index:25;
    width:54px;height:54px;border-radius:50%;background:var(--amber);color:#fff;border:none;
    font-size:26px;box-shadow:0 6px 16px rgba(224,138,44,.5);cursor:pointer;
  }

  .overlay{position:fixed;inset:0;background:rgba(15,20,28,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center;}
  .confirm-overlay{position:fixed;inset:0;background:rgba(15,20,28,.55);z-index:300;display:flex;align-items:center;justify-content:center;padding:24px;}
  .confirm-box{background:#fff;border-radius:16px;padding:20px;max-width:340px;width:100%;text-align:center;}
  .confirm-box p{font-size:15px;margin:6px 0 18px;line-height:1.6;}
  .confirm-box .btn-row{display:flex;gap:10px;}
  .confirm-box .btn-row button{flex:1;}
  .sheet{background:#fff;width:100%;max-width:520px;border-radius:20px 20px 0 0;max-height:88vh;overflow-y:auto;padding:18px;animation:up .2s ease;}
  @keyframes up{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
  .sheet .sheethead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
  .sheet h2{font-size:17px;margin:0;color:var(--navy);}
  .closebtn{background:#f1ede4;border:none;width:32px;height:32px;border-radius:50%;font-size:16px;cursor:pointer;}

  .cartline{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px dashed var(--line);}
  .cartline .ci-name{flex:1;font-size:13.5px;font-weight:600;}
  .cartline .ci-qty{width:56px;}
  .cartline .ci-total{width:66px;text-align:left;font-weight:700;font-size:13px;}
  .cartline .rm{background:none;border:none;color:var(--red);font-size:18px;cursor:pointer;}

  .totalsbox{background:#f7f3ea;border-radius:12px;padding:12px;margin-top:10px;}
  .totalsbox .tr{display:flex;justify-content:space-between;font-size:14px;padding:3px 0;}
  .totalsbox .tr.grand{font-weight:800;font-size:17px;color:var(--navy);border-top:1px dashed #d8cfba;margin-top:6px;padding-top:8px;}

  .empty{text-align:center;padding:30px 10px;color:var(--muted);}
  .empty .ic{font-size:38px;margin-bottom:8px;}

  .invoice-preview{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;}
  .invoice-preview .ihead{text-align:center;margin-bottom:10px;}
  .invoice-preview .ihead h2{margin:0;color:var(--navy);font-size:17px;}
  .invoice-preview .ihead .addr{font-size:11.5px;color:var(--muted);}
  .invoice-preview table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px;}
  .invoice-preview th{background:#f1ede4;padding:6px;font-size:11.5px;}
  .invoice-preview td{padding:6px;border-bottom:1px solid #eee;}

  .toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:30px;font-size:13px;z-index:80;box-shadow:0 4px 14px rgba(0,0,0,.25);}

  .wa{background:#25D366;color:#fff;}
  #scannerViewport{position:relative;width:100%;border-radius:12px;overflow:hidden;background:#000;min-height:260px;}
  #scannerViewport video,#scannerViewport canvas{width:100%!important;height:auto!important;display:block;}
  #scannerViewport .drawingBuffer{position:absolute;top:0;left:0;}
  .scan-line{position:absolute;left:6%;right:6%;top:50%;height:2px;background:var(--amber);box-shadow:0 0 8px var(--amber);z-index:5;}

  /* PIN lock */
  #lockRoot:empty{display:none;}
  .lockwrap{position:fixed;inset:0;z-index:200;background:linear-gradient(135deg,var(--navy),var(--navy2));display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;padding:20px;}
  .lockwrap h2{margin:0 0 4px;font-size:18px;font-weight:800;}
  .lockwrap .sub{font-size:12.5px;opacity:.75;margin-bottom:22px;}
  .lock-dots{display:flex;gap:14px;margin-bottom:26px;}
  .lock-dots span{width:15px;height:15px;border-radius:50%;border:1.5px solid rgba(255,255,255,.6);background:transparent;}
  .lock-dots span.filled{background:var(--amber);border-color:var(--amber);}
  .lock-err{color:#ff9d8a;font-size:12.5px;min-height:16px;margin-bottom:10px;}
  .lock-keypad{display:grid;grid-template-columns:repeat(3,72px);gap:14px;}
  .lock-keypad button{width:72px;height:72px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;font-size:22px;font-weight:700;cursor:pointer;}
  .lock-keypad button:active{background:rgba(255,255,255,.22);}
  .lock-keypad button.wide{font-size:14px;}
  .lock-logo{width:56px;height:56px;border-radius:16px;background:var(--amber);display:flex;align-items:center;justify-content:center;font-size:28px;margin-bottom:14px;}
  .customerRow{display:flex;justify-content:space-between;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer;}
  .avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--navy2),var(--navy));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;flex:none;box-shadow:0 3px 8px rgba(18,42,67,.35);}
  .bank-avatar{width:40px;height:40px;border-radius:12px;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;flex:none;box-shadow:0 3px 8px rgba(0,0,0,.22);}
  .flexrow{display:flex;align-items:center;gap:10px;}

  select{-webkit-appearance:none;appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%236b7684'><path d='M7 10l5 5 5-5z'/></svg>");background-repeat:no-repeat;background-position:8px center;padding-left:30px;}

  @media print{
    body *{visibility:hidden;}
    #printArea, #printArea *{visibility:visible;}
    #printArea{position:absolute;top:0;left:0;width:100%;}
  }

  /* ---- Purchase-from-supplier flow ---- */
  .pur-amtbox{background:linear-gradient(135deg,var(--green),#166b3e);color:#fff;border-radius:14px;padding:16px 16px 14px;margin-bottom:12px;}
  .pur-amtbox .pur-amt-label{font-size:12.5px;opacity:.88;margin-bottom:4px;}
  .pur-amtbox .pur-amt-value{font-size:26px;font-weight:800;}
  .calc-pad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px;}
  .calc-btn{padding:15px 0;border:none;border-radius:10px;background:#f1ede4;font-size:17px;font-weight:700;cursor:pointer;color:var(--ink);}
  .calc-btn:active{background:#e4ddcd;}
  .calc-btn.func{background:#e7e1d6;color:var(--navy);}
  .calc-btn.op{background:var(--amber);color:#fff;}
  .calc-btn.op:active{background:var(--amber-dark);}
  .calc-btn.eq{background:var(--green);color:#fff;}
  .pur-item-row{padding:10px 4px;border-bottom:1px solid var(--line);}
  .pur-item-row:last-child{border-bottom:none;}
  .pur-item-head{display:flex;align-items:center;gap:10px;cursor:pointer;}
  .pur-item-head input[type=checkbox]{width:19px;height:19px;accent-color:var(--green);flex:none;}
  .sup-headrow{display:flex;padding:4px 4px 8px;color:var(--muted);font-size:11.5px;font-weight:700;border-bottom:1px solid var(--line);margin-top:6px;}
  .sup-headrow span{flex:1;text-align:center;}
  .sup-headrow span:last-child{flex:1.6;text-align:right;}
  .sup-row{display:flex;align-items:flex-start;gap:4px;padding:10px 2px;border-bottom:1px solid var(--line);}
  .sup-row:last-child{border-bottom:none;}
  .sup-col{flex:1;text-align:center;font-weight:800;font-size:13px;padding-top:2px;}
  .sup-col.info{flex:1.6;text-align:right;font-weight:400;}
  .sup-col.info .desc{font-weight:700;font-size:13.5px;color:var(--ink);}
  .amt-red{color:var(--red);}
  .amt-green{color:var(--green);}
  .attach-btn{background:none;border:none;font-size:16px;cursor:pointer;color:var(--muted);flex:none;align-self:center;}

  /* ---- Full-screen stock screens: In/Out reports + per-item history ---- */
  .fs{position:fixed;inset:0;z-index:40;background:var(--cream);display:flex;flex-direction:column;max-width:520px;margin:0 auto;}
  .fs-head{flex:none;color:#fff;padding:calc(14px + env(safe-area-inset-top)) 14px 18px;border-radius:0 0 26px 26px;box-shadow:0 4px 14px rgba(0,0,0,.18);}
  .fs-head.out{background:linear-gradient(135deg,#d7301b,#f0741f);}
  .fs-head.in{background:linear-gradient(135deg,#166b3e,#2fae6d);}
  .fs-head.item{background:linear-gradient(135deg,var(--navy),var(--navy2));}
  .fs-headrow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;}
  .fs-title{flex:1;text-align:center;font-size:20px;font-weight:800;line-height:1.35;min-width:0;overflow-wrap:anywhere;}
  .fs-x{flex:none;width:40px;height:40px;border-radius:50%;border:none;background:#fff;color:#333;font-size:18px;font-weight:800;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.2);}
  .fs-sp{flex:none;width:40px;}
  .fs-search{display:flex;align-items:center;gap:8px;background:#fff;border-radius:16px;padding:2px 12px;color:var(--ink);}
  .fs-search input{flex:1;min-width:0;border:none;background:transparent;padding:11px 2px;font-size:14.5px;}
  .fs-search input:focus{outline:none;}
  .fs-search select{width:auto;flex:none;border:none;border-right:1px solid var(--line);border-radius:0;padding-top:8px;padding-bottom:8px;font-weight:700;font-size:14px;color:var(--navy);background-color:transparent;}
  .fs-dates{flex:none;display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px 14px 4px;}
  .fs-datebox{position:relative;background:#fff;border:1px solid var(--line);border-radius:14px;padding:7px 10px 4px;}
  .fs-datebox .dl{display:block;font-size:11.5px;color:var(--muted);font-weight:700;}
  .fs-datebox input{border:none;padding:2px 0 4px;font-size:14px;background:transparent;width:100%;}
  .fs-datebox input:focus{outline:none;}
  .fs-datebox .dclr{position:absolute;top:7px;left:8px;border:none;background:#f1ede4;width:22px;height:22px;border-radius:50%;font-size:11px;cursor:pointer;color:var(--muted);}
  .sr-grid{display:grid;grid-template-columns:1.7fr .75fr .85fr 1.1fr;gap:6px;align-items:center;}
  .sr-grid > div:nth-child(2),.sr-grid > div:nth-child(3){text-align:center;}
  .sr-grid > div:nth-child(4){text-align:left;}
  .sr-head{flex:none;padding:10px 18px 2px;color:var(--muted);font-size:12.5px;font-weight:700;}
  .sr-head .arr{border:none;background:#f1ede4;border-radius:8px;width:24px;height:22px;font-size:13px;font-weight:800;cursor:pointer;color:var(--navy);margin-inline-start:4px;}
  .sr-sum{flex:none;padding:2px 18px 10px;font-weight:800;font-size:15px;border-bottom:1px solid var(--line);}
  .sr-sum.out{color:#c8213f;} .sr-sum.in{color:var(--green);}
  .fs-body{flex:1;overflow-y:auto;padding:0 14px 14px;-webkit-overflow-scrolling:touch;}
  .sr-row{padding:11px 4px;border-bottom:1px solid var(--line);font-weight:700;font-size:14.5px;}
  .sr-row.out{color:#c8213f;} .sr-row.in{color:var(--green);}
  .sr-row .nm{color:var(--ink);min-width:0;}
  .sr-row .n1{font-weight:800;font-size:14px;overflow-wrap:anywhere;}
  .sr-row .n2,.sr-row .n3{font-size:11.5px;color:var(--muted);font-weight:500;margin-top:2px;}
  .fs-foot{flex:none;display:flex;gap:10px;align-items:center;padding:10px 14px calc(12px + env(safe-area-inset-bottom));background:var(--cream);border-top:1px solid var(--line);}
  .fs-print{flex:none;width:52px;height:52px;border-radius:50%;border:none;background:#f2c230;font-size:22px;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.2);}
  .fs-pdf{flex:1;height:52px;border-radius:26px;border:2px solid #d8434a;background:#fff;color:#d8434a;font-size:16px;font-weight:800;cursor:pointer;}
  .hx-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .hx-stats > div{background:rgba(255,255,255,.14);border-radius:14px;padding:10px 12px;}

<div id="confirmRoot"></div>
<div id="printArea" style="display:none"></div>

<script>
/* ===================== STATE / STORAGE ===================== */
let DB = null;
const STORAGE_KEY = 'aghajan_shop_data_v1';

function defaultDB(){
  return {
    shop:{ name:'اغا جان سائیکلون آٹا چکی', address:'', phone:'', pin:'' },
    items:[], customers:[], banks:[], sales:[], purchases:[],
    cashEntries:[], bankEntries:[], collections:[], trash:[],
    amanatPersons:[], amanatEntries:[],
    suppliers:[], supplierPayments:[],
    invoiceCounter: 0
  };
}

const hasCloudStorage = (typeof window.storage !== 'undefined' && window.storage && typeof window.storage.get === 'function');
let cloudWorks = false;

/* ---- Firebase (live cross-device sync) ---- */
const firebaseConfig = {
  apiKey: "AIzaSyBI-a4Dhp7biziLSGe64yXdZqrPNXj0G7I",
  authDomain: "kaleem-auto-mobile.firebaseapp.com",
  projectId: "kaleem-auto-mobile",
  storageBucket: "kaleem-auto-mobile.firebasestorage.app",
  messagingSenderId: "13650254950",
  appId: "1:13650254950:web:5af9e01e3e5d6a0ac5a1a7",
  measurementId: "G-KW36F6F5YW"
};
let fbDb=null, hasFirebase=false, unsubscribeFB=null;
try{
  if(typeof firebase!=='undefined'){
    firebase.initializeApp(firebaseConfig);
    fbDb = firebase.firestore();
    hasFirebase = true;
  }
}catch(e){ console.error('Firebase init failed', e); }
function FB_DOC(){ return fbDb.collection('shops').doc('aghajan'); }
const deviceId = (function(){
  let id=null;
  try{ id = localStorage.getItem('kaleem_device_id'); }catch(e){}
  if(!id){ id = 'dev_'+Math.random().toString(36).slice(2,10); try{ localStorage.setItem('kaleem_device_id', id); }catch(e){} }
  return id;
})();
let lastLocalWriteStamp=0;
function startFBListener(){
  if(unsubscribeFB || !hasFirebase) return;
  unsubscribeFB = FB_DOC().onSnapshot(function(snap){
    if(!snap.exists) return;
    const data=snap.data();
    if(!data || !data.db) return;
    if(data.updatedBy===deviceId && data.updatedAt===lastLocalWriteStamp) return;
    try{
      const remote=JSON.parse(data.db);
      remote.items=remote.items||[]; remote.customers=remote.customers||[]; remote.banks=remote.banks||[];
      remote.sales=remote.sales||[]; remote.purchases=remote.purchases||[]; remote.cashEntries=remote.cashEntries||[];
      remote.bankEntries=remote.bankEntries||[]; remote.collections=remote.collections||[]; remote.invoiceCounter=remote.invoiceCounter||0;
      remote.trash=remote.trash||[];
      remote.amanatPersons=remote.amanatPersons||[]; remote.amanatEntries=remote.amanatEntries||[];
      remote.suppliers=remote.suppliers||[]; remote.supplierPayments=remote.supplierPayments||[];
      remote.shop=remote.shop||defaultDB().shop;
      DB=remote;
      try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(DB)); }catch(e){}
      cloudWorks=true;
      const overlayEmpty = !document.getElementById('overlayRoot') || !document.getElementById('overlayRoot').innerHTML.trim();
      if(overlayEmpty && !isLocked()){ render(); refreshFs(); }
    }catch(e){ console.error('Firestore apply failed', e); }
  }, function(err){ console.error('Firestore listen error', err); });
}

async function loadDB(){
  let loaded=null;
  if(hasFirebase){
    try{
      const snap = await withTimeout(FB_DOC().get(), 6000);
      if(snap.exists && snap.data().db){ loaded=JSON.parse(snap.data().db); cloudWorks=true; }
    }catch(e){ console.error('Firestore load failed/timed out', e); }
  }
  if(!loaded && hasCloudStorage){
    try{
      const res = await withTimeout(window.storage.get(STORAGE_KEY, false), 6000);
      if(res && res.value){ loaded=JSON.parse(res.value); cloudWorks=true; }
    }catch(e){}
  }
  let local=null;
  try{ const raw=localStorage.getItem(STORAGE_KEY); if(raw) local=JSON.parse(raw); }catch(e){}
  if(!loaded) loaded = local;
  DB = loaded || defaultDB();
  DB.items=DB.items||[]; DB.customers=DB.customers||[]; DB.banks=DB.banks||[];
  DB.sales=DB.sales||[]; DB.purchases=DB.purchases||[]; DB.cashEntries=DB.cashEntries||[];
  DB.bankEntries=DB.bankEntries||[]; DB.collections=DB.collections||[]; DB.invoiceCounter=DB.invoiceCounter||0;
  DB.trash=DB.trash||[];
  DB.amanatPersons=DB.amanatPersons||[]; DB.amanatEntries=DB.amanatEntries||[];
  DB.suppliers=DB.suppliers||[]; DB.supplierPayments=DB.supplierPayments||[];
  if(hasFirebase) startFBListener();
}
let formSubmitting=false;
function lockSubmit(){ if(formSubmitting) return false; formSubmitting=true; return true; }
function unlockSubmit(){ formSubmitting=false; }
let cloudSyncQueued=false, cloudSyncTimer=null;
// Plain, synchronous function — NOT async, NO internal await. Guarantees the
// local save (and anything after it in the caller) never waits on the network
// or on a browser-throttled promise/microtask, even in odd connectivity states.
function saveDB(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(DB)); }catch(e){}
  const dbJson = JSON.stringify(DB);
  clearTimeout(cloudSyncTimer);
  cloudSyncTimer = setTimeout(function(){ syncToCloudBackground(dbJson); }, 0);
}
function withTimeout(promise, ms){
  return Promise.race([
    promise,
    new Promise((_,reject)=>setTimeout(()=>reject(new Error('timeout')), ms))
  ]);
}
async function syncToCloudBackground(dbJson){
  if(hasFirebase){
    try{
      lastLocalWriteStamp = Date.now();
      await withTimeout(FB_DOC().set({ db: dbJson, updatedBy: deviceId, updatedAt: lastLocalWriteStamp }), 8000);
      cloudWorks=true;
    }catch(e){ console.error('Firestore save failed/timed out', e); }
  }
  if(hasCloudStorage){
    try{ await withTimeout(window.storage.set(STORAGE_KEY, dbJson, false), 8000); cloudWorks=true; }
    catch(e){}
  }
}

function downloadBackup(){
  const blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  const stamp=new Date().toISOString().slice(0,10);
  a.href=url; a.download='aghajan-atta-chakki-backup-'+stamp+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast('📁 بیک اپ فائل ڈاؤن لوڈ ہو گئی');
}
function triggerRestore(){ document.getElementById('restoreFileInput').click(); }
async function restoreFromFile(evt){
  const file=evt.target.files[0]; if(!file) return;
  try{
    const text=await file.text();
    const parsed=JSON.parse(text);
    if(!parsed || !Array.isArray(parsed.items)) throw new Error('invalid');
    if(!(await customConfirm('موجودہ ڈیٹا اس بیک اپ فائل سے بدل دیا جائے گا۔ جاری رکھیں؟'))) return;
    DB=parsed; await saveDB(); toast('✅ بیک اپ واپس آ گیا'); render();
  }catch(e){ toast('⚠️ یہ فائل صحیح بیک اپ نہیں ہے'); }
  evt.target.value='';
}

/* ===================== UTIL ===================== */
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function todayStr(){ const d=new Date(); return d.toISOString().slice(0,10); }
function fmtDate(s){ if(!s) return ''; const d=new Date(s); return d.toLocaleDateString('ur-PK',{year:'numeric',month:'2-digit',day:'2-digit'}); }
function fmtTime(ts){ if(!ts) return ''; const d=new Date(ts); return d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',hour12:true}); }
function fmtDateTime(dateStr,ts){ return fmtDate(dateStr) + (ts?' • '+fmtTime(ts):''); }
function money(n){ n=Number(n)||0; return n.toLocaleString('en-US',{maximumFractionDigits:2}); }
function toast(msg){
  const t=document.createElement('div'); t.className='toast'; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(),2200);
}
function waLink(phone,text){
  let p=(phone||'').replace(/[^0-9]/g,'');
  if(p.startsWith('0')) p='92'+p.slice(1);
  if(!p.startsWith('92') && p.length===10) p='92'+p;
  return 'https://wa.me/'+p+'?text='+encodeURIComponent(text);
}
function shopCardText(){
  return `🏪 ${DB.shop.name}`+(DB.shop.address?`\n📍 ${DB.shop.address}`:'')+(DB.shop.phone?`\n📞 ${DB.shop.phone}`:'');
}
async function shareShopCard(){
  const text=shopCardText();
  if(navigator.share){
    try{ await navigator.share({title:DB.shop.name, text}); return; }catch(e){ if(e && e.name==='AbortError') return; }
  }
  window.open('https://wa.me/?text='+encodeURIComponent(text),'_blank');
}
function itemById(id){ return DB.items.find(i=>i.id===id); }
function custById(id){ return DB.customers.find(c=>c.id===id); }
function bankById(id){ return DB.banks.find(b=>b.id===id); }

/* purchase items — supports old single-item purchases and new multi-item ones */
function purchaseItems(p){
  if(p.items && p.items.length) return p.items;
  if(p.itemId) return [{itemId:p.itemId, name:p.itemName, qty:p.qty, cost:p.cost}];
  return [];
}
function purchaseItemsLabel(p){
  const its=purchaseItems(p);
  if(!its.length) return p.note || 'خریداری';
  if(its.length===1) return its[0].name + (its[0].qty?' × '+its[0].qty:'');
  return its[0].name + ' + '+(its.length-1)+' مزید آئٹمز';
}
function applyStockForPurchase(p){ purchaseItems(p).forEach(it=>{ const item=itemById(it.itemId); if(item) item.stock=(Number(item.stock)||0)+Number(it.qty||0); }); }
function reverseStockForPurchase(p){ purchaseItems(p).forEach(it=>{ const item=itemById(it.itemId); if(item) item.stock=(Number(item.stock)||0)-Number(it.qty||0); }); }

/* customer computed balance */
function custDue(c){
  let due = Number(c.openingDue)||0;
  DB.sales.forEach(s=>{ if(s.customerId===c.id && s.paymentType==='ادھار') due += s.netTotal; });
  DB.collections.forEach(col=>{ if(col.customerId===c.id){ due += col.type==='given' ? (Number(col.amount)||0) : -(Number(col.amount)||0); } });
  return due;
}
function cashBalance(){
  let bal = 0;
  DB.cashEntries.forEach(e=>{ bal += (Number(e.in)||0) - (Number(e.out)||0); });
  DB.sales.forEach(s=>{ if(s.paymentType==='نقد') bal += s.netTotal; });
  DB.purchases.forEach(p=>{ if(p.paymentType==='نقد') bal -= p.total; });
  return bal;
}
function bankBalance(bankId){
  let bal=0;
  DB.bankEntries.forEach(e=>{ if(e.bankId===bankId) bal += (Number(e.in)||0)-(Number(e.out)||0); });
  DB.sales.forEach(s=>{ if(s.paymentType==='بینک' && s.bankId===bankId) bal += s.netTotal; });
  DB.purchases.forEach(p=>{ if(p.paymentType==='بینک' && p.bankId===bankId) bal -= p.total; });
  return bal;
}
function totalBankBalance(){ return DB.banks.reduce((a,b)=>a+bankBalance(b.id),0); }
function totalDue(){ return DB.customers.reduce((a,c)=>a+custDue(c),0); }
function stockValue(){ return DB.items.reduce((a,i)=>a+(Number(i.stock)||0)*(Number(i.costPrice)||0),0); }

/* ===================== NAV ===================== */
let currentTab='dash';
function go(tab){
  closeFs();
  currentTab=tab;
  document.querySelectorAll('nav.bottomnav button').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
  const titles={dash:'ڈیش بورڈ', pos:'نئی سیل بنائیں', stock:'انوینٹری', customers:'کسٹمرز', more:'مزید آپشنز'};
  document.getElementById('screenTitle').textContent = titles[tab]||'';
  const fab=document.getElementById('fabBtn');
  fab.style.display = (tab==='stock'||tab==='customers') ? 'flex' : 'none';
  render();
}
function fabAction(){
  if(currentTab==='stock') openItemForm();
  if(currentTab==='customers') openCustomerForm();
}

function render(){
  const main=document.getElementById('main');
  document.getElementById('shopNameHdr').textContent = DB.shop.name;
  document.getElementById('shopAddrHdr').textContent = DB.shop.address;
  if(currentTab==='dash') return renderDash(main);
  if(currentTab==='pos') return renderPOS(main);
  if(currentTab==='stock') return renderStock(main);
  if(currentTab==='customers') return renderCustomers(main);
  if(currentTab==='more') return renderMore(main);
}

/* ===================== DASHBOARD ===================== */
function renderDash(main){
  const lowStock = DB.items.filter(i=> (Number(i.stock)||0) <= (Number(i.reorderLevel)||0));
  const todaySales = DB.sales.filter(s=>s.date===todayStr()).reduce((a,s)=>a+s.netTotal,0);
  main.innerHTML = `
    <div class="grid2">
      <div class="stat good"><div class="label">آج کی فروخت</div><div class="value">${money(todaySales)}</div></div>
      <div class="stat"><div class="label">کیش بیلنس</div><div class="value">${money(cashBalance())}</div></div>
      <div class="stat"><div class="label">بینک بیلنس (سب)</div><div class="value">${money(totalBankBalance())}</div></div>
      <div class="stat warn"><div class="label">کل بقایا (ادھار)</div><div class="value">${money(totalDue())}</div></div>
      <div class="stat"><div class="label">اسٹاک کی مالیت</div><div class="value">${money(stockValue())}</div></div>
      <div class="stat ${lowStock.length? 'warn':'good'}"><div class="label">کم اسٹاک آئٹمز</div><div class="value">${lowStock.length}</div></div>
    </div>
    ${lowStock.length? `<div class="card"><h3>⚠️ کم اسٹاک آئٹمز</h3>${lowStock.map(i=>`
      <div class="list-item"><div><div class="name">${esc(i.name)}</div><div class="meta">باقی: ${i.stock}</div></div><span class="badge low">دوبارہ منگوائیں</span></div>`).join('')}</div>`:''}
    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;">
        <h3 style="margin:0;">🕓 حالیہ سیلز</h3>
        <span style="color:var(--navy);font-weight:700;font-size:12.5px;cursor:pointer;" onclick="goAllSales()">سب دیکھیں ›</span>
      </div>
      ${recentSalesHTML()}
    </div>
    <div class="btn-row" style="margin-top:4px;">
      <button class="btn btn-primary" onclick="go('pos')">🧾 نئی سیل بنائیں</button>
    </div>
  `;
}
function recentSalesHTML(){
  const list=[...DB.sales].sort((a,b)=>b.createdAt-a.createdAt).slice(0,5);
  if(!list.length) return `<div class="empty"><div class="ic">🧾</div>ابھی کوئی سیل نہیں ہوئی</div>`;
  return list.map(s=>{
    const c=custById(s.customerId);
    return `<div class="list-item" onclick="showInvoice(DB.sales.find(x=>x.id==='${s.id}'))" style="cursor:pointer;"><div><div class="name">${esc(c?c.name:'واک اِن گاہک')} — ${s.invoiceNo}</div>
      <div class="meta">${fmtDate(s.date)} • ${s.paymentType}</div></div><div style="font-weight:800;">${money(s.netTotal)}</div></div>`;
  }).join('');
}

/* ===================== POS ===================== */
let cart=[];
let posCustomerId=null, posPayType='نقد', posBankId=null;
let editingSaleId=null, editingSaleDiscount=0;
let posSignature=null, posBillImage=null;
function renderPOS(main){
  main.innerHTML = `
    ${editingSaleId?`<div class="card" style="background:#fff7e6;border:1px solid #f0c36d;"><b>✏️ بل میں ترمیم ہو رہی ہے</b> — محفوظ کرنے پر پرانا بل اپڈیٹ ہو جائے گا۔ <button class="btn btn-outline btn-sm" style="margin-top:8px;" onclick="cancelEditSale()">❌ ترمیم منسوخ کریں</button></div>`:''}
    <div class="card">
      <label>کسٹمر</label>
      <select id="posCust" onchange="posCustomerId=this.value">
        <option value="">— واک اِن گاہک (بغیر نام) —</option>
        ${DB.customers.map(c=>`<option value="${c.id}" ${posCustomerId===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}
      </select>
      <button class="btn btn-outline btn-sm" style="margin-top:8px;" onclick="openCustomerForm(true)">+ نیا کسٹمر شامل کریں</button>
    </div>

    <div class="card">
      <label>آئٹم شامل کریں</label>
      <div class="wsmode">
        <span class="wl">🛍️ ہول سیل موڈ</span>
        <label class="swtch"><input type="checkbox" id="posWsToggle" ${posWholesaleMode?'checked':''} onchange="setWholesaleMode(this.checked)"><span class="sl"></span></label>
      </div>
      <input type="text" id="posItemSearch" placeholder="آئٹم کا نام یا بارکوڈ لکھیں..." autocomplete="off" oninput="filterPosItems(this.value)" onfocus="filterPosItems(this.value)">
      <div id="posItemResults" style="position:relative;"></div>
      <div id="posCatTabs" class="cattabs" style="margin-top:10px;"></div>
      <div id="posGrid" class="prodgrid" style="margin-top:8px;"></div>
      <div id="posPriceTypeWrap"></div>
      <div class="btn-row" style="margin-top:8px;">
        <input type="number" id="posQty" placeholder="مقدار" value="1" step="0.01" style="max-width:120px;">
        <button class="btn btn-navy" onclick="addToCart()">➕ کارٹ میں شامل کریں</button>
      </div>
      <div class="btn-row" style="margin-top:6px;gap:6px;">
        <button class="btn btn-outline btn-sm" style="flex:1;" onclick="setPosQty(0.25)">پاؤ (¼)</button>
        <button class="btn btn-outline btn-sm" style="flex:1;" onclick="setPosQty(0.5)">آدھا (½)</button>
        <button class="btn btn-outline btn-sm" style="flex:1;" onclick="setPosQty(0.75)">تین پاؤ (¾)</button>
        <button class="btn btn-outline btn-sm" style="flex:1;" onclick="setPosQty(1)">1 لیٹر</button>
      </div>
      <button class="btn btn-outline" style="margin-top:8px;" onclick="scanPOSItem()">📷 بارکوڈ اسکین کر کے شامل کریں</button>
    </div>

    <div class="card">
      <h3>🛒 کارٹ</h3>
      <div id="cartBox">${cartHTML()}</div>
    </div>

    <div class="card">
      <label>ادائیگی کی قسم</label>
      <div class="seg" id="paySeg">
        <button class="${posPayType==='نقد'?'on':''}" onclick="setPayType('نقد')">نقد</button>
        <button class="${posPayType==='بینک'?'on':''}" onclick="setPayType('بینک')">بینک</button>
        <button class="${posPayType==='ادھار'?'on':''}" onclick="setPayType('ادھار')">ادھار</button>
      </div>
      ${posPayType==='بینک' ? `
        <label>بینک منتخب کریں</label>

function initSignaturePad(){
  const canvas=document.getElementById('sigPad');
  if(!canvas) return;
  const ratio=window.devicePixelRatio||1;
  canvas.width=canvas.clientWidth*ratio; canvas.height=canvas.clientHeight*ratio;
  const ctx=canvas.getContext('2d');
  ctx.scale(ratio,ratio); ctx.lineWidth=2; ctx.lineCap='round'; ctx.strokeStyle='#1a1a2e';
  if(posSignature){ const img=new Image(); img.onload=()=>ctx.drawImage(img,0,0,canvas.clientWidth,canvas.clientHeight); img.src=posSignature; }
  let drawing=false, last=null;
  function pos(e){ const r=canvas.getBoundingClientRect(); const t=e.touches?e.touches[0]:e; return {x:t.clientX-r.left, y:t.clientY-r.top}; }
  function start(e){ drawing=true; last=pos(e); e.preventDefault(); }
  function move(e){ if(!drawing) return; const p=pos(e); ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke(); last=p; e.preventDefault(); }
  function end(){ if(!drawing) return; drawing=false; posSignature=canvas.toDataURL('image/png'); }
  canvas.addEventListener('mousedown',start); canvas.addEventListener('mousemove',move); canvas.addEventListener('mouseup',end); canvas.addEventListener('mouseleave',end);
  canvas.addEventListener('touchstart',start); canvas.addEventListener('touchmove',move); canvas.addEventListener('touchend',end);
}
function clearSignature(){
  posSignature=null;
  const canvas=document.getElementById('sigPad');
  if(canvas){ const ctx=canvas.getContext('2d'); ctx.clearRect(0,0,canvas.width,canvas.height); }
}
function capturePOSBillPhoto(input){
  const file=input.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=function(e){
    const img=new Image();
    img.onload=function(){
      const maxW=800; const scale=Math.min(1,maxW/img.width);
      const cv=document.createElement('canvas'); cv.width=img.width*scale; cv.height=img.height*scale;
      cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
      posBillImage=cv.toDataURL('image/jpeg',0.6);
      renderPOS(document.getElementById('main'));
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

async function finalizeSale(){
  if(!lockSubmit()) return;
  try{
  if(!cart.length){ toast('کارٹ میں کچھ نہیں ہے'); return; }
  if(posPayType==='بینک' && !posBankId){ toast('بینک منتخب کریں'); return; }
  const discount = parseFloat(document.getElementById('posDiscount').value)||0;
  const subtotal = cart.reduce((a,c)=>a+c.qty*c.price,0);
  const netTotal = subtotal-discount;
  if(editingSaleId){
    const sale=DB.sales.find(s=>s.id===editingSaleId);
    if(sale){
      sale.customerId = posCustomerId||null;
      sale.items = cart.map(c=>({itemId:c.itemId,name:c.name,qty:c.qty,price:c.price}));
      sale.subtotal = subtotal; sale.discount = discount; sale.netTotal = netTotal;
      sale.paymentType = posPayType; sale.bankId = posPayType==='بینک'?posBankId:null;
      sale.signature = posPayType==='ادھار' ? (posSignature||null) : null;
      sale.billImage = posBillImage||null;
      cart.forEach(c=>{ const it=itemById(c.itemId); if(it) it.stock=(Number(it.stock)||0)-c.qty; });
      await saveDB();
      const savedSale=sale;
      cart=[]; posCustomerId=null; posPayType='نقد'; posBankId=null; editingSaleId=null; editingSaleDiscount=0; posSignature=null; posBillImage=null;
      toast('✅ بل میں ترمیم محفوظ ہو گئی — '+savedSale.invoiceNo);
      showInvoice(savedSale);
    }
    return;
  }
  DB.invoiceCounter++;
  const invoiceNo = 'INV-'+String(DB.invoiceCounter).padStart(4,'0');
  const sale = {
    id:uid(), invoiceNo, date:todayStr(), createdAt:Date.now(),
    customerId: posCustomerId||null,
    items: cart.map(c=>({itemId:c.itemId,name:c.name,qty:c.qty,price:c.price})),
    subtotal, discount, netTotal,
    paymentType: posPayType, bankId: posPayType==='بینک'?posBankId:null,
    signature: posPayType==='ادھار' ? (posSignature||null) : null,
    billImage: posBillImage||null
  };
  DB.sales.push(sale);
  cart.forEach(c=>{ const it=itemById(c.itemId); if(it) it.stock=(Number(it.stock)||0)-c.qty; });
  await saveDB();
  cart=[]; posCustomerId=null; posPayType='نقد'; posBankId=null; posSignature=null; posBillImage=null;
  toast('✅ سیل محفوظ ہو گئی — '+invoiceNo);
  showInvoice(sale);
  } finally { unlockSubmit(); }
}

const EN_DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const EN_MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtDateEn(s){
  if(!s) return '';
  const p=String(s).split('-'); const d=new Date(+p[0],(+p[1]||1)-1,+p[2]||1);
  if(isNaN(d.getTime())) return String(s);
  return EN_DAYS[d.getDay()]+', '+d.getDate()+' '+EN_MONTHS[d.getMonth()]+' '+String(d.getFullYear()).slice(2);
}
function fmtDateTimeEn(date,ts){ return fmtDateEn(date)+(ts?' • '+fmtTime(ts):''); }

/* One flat list of stock movements built from the existing sales (OUT) and purchases (IN) */
function stockMovements(opts){
  opts=opts||{};
  const list=[];
  if(opts.kind!=='in'){
    DB.sales.forEach(s=>{
      const c=custById(s.customerId);
      const its=s.items||[];
      its.forEach(it=>{
        if(opts.itemId && it.itemId!==opts.itemId) return;
        const q=Number(it.qty)||0, pr=Number(it.price)||0;
        const known=itemById(it.itemId);
        list.push({type:'out', id:s.id, itemId:it.itemId, name:it.name||(known?known.name:''), qty:q, price:pr, total:q*pr,
          date:s.date, ts:s.createdAt||0, party:c?c.name:'', pay:s.paymentType||'', ref:s.invoiceNo||'', lines:its.length});
      });
    });
  }
  if(opts.kind!=='out'){
    DB.purchases.forEach(p=>{
      const its=purchaseItems(p);
      its.forEach(it=>{
        if(opts.itemId && it.itemId!==opts.itemId) return;
        const q=Number(it.qty)||0, pr=Number(it.cost)||0;
        const known=itemById(it.itemId);
        list.push({type:'in', id:p.id, itemId:it.itemId, name:it.name||(known?known.name:''), qty:q, price:pr, total:q*pr,
          date:p.date, ts:p.createdAt||0, party:p.supplier||'', pay:p.paymentType||'', ref:'', lines:its.length});
      });
    });
  }
  return list;
}
function cmpMov(a,b){
  const da=a.date||'', db=b.date||'';
  if(da<db) return -1; if(da>db) return 1;
  return (a.ts||0)-(b.ts||0);
}

function stockReportPages(){

/* Long reports are rendered page by page so a big list never exceeds the browser's canvas size limit */
async function exportPagedPdf(pageHtmls, filename){
  const holder=document.createElement('div');
  holder.style.position='fixed'; holder.style.left='-99999px'; holder.style.top='0';
  document.body.appendChild(holder);
  try{
    const { jsPDF } = window.jspdf;
    const pdf=new jsPDF('p','pt','a4');
    const pageW=pdf.internal.pageSize.getWidth(), pageH=pdf.internal.pageSize.getHeight();
    for(let i=0;i<pageHtmls.length;i++){
      holder.innerHTML=pageHtmls[i];
      const target=holder.querySelector('#pdfCapture')||holder;
      const canvas=await html2canvas(target,{scale:2,backgroundColor:'#ffffff',useCORS:true});
      let w=pageW, h=canvas.height*(w/canvas.width);
      if(h>pageH){ h=pageH; w=canvas.width*(h/canvas.height); }
      if(i>0) pdf.addPage();
      pdf.addImage(canvas.toDataURL('image/jpeg',0.92),'JPEG',(pageW-w)/2,0,w,h);
    }
    return { blob: pdf.output('blob'), filename };
  }catch(e){
    console.error('PDF export failed', e);
    toast('PDF بنانے میں مسئلہ ہوا');
    return null;
  }finally{
    document.body.removeChild(holder);
  }
}

async function deleteStockEntry(type,id){
  if(type==='out'){
    const sale=DB.sales.find(s=>s.id===id); if(!sale) return;
    const n=(sale.items||[]).length;
    const msg = n>1
      ? `یہ پورا بل (${sale.invoiceNo}) حذف ہو گا جس میں ${n} آئٹمز ہیں۔ سب کا اسٹاک واپس ہو جائے گا۔ جاری رکھیں؟`
      : `یہ بل (${sale.invoiceNo}) حذف کرنا چاہتے ہیں؟ اسٹاک واپس ہو جائے گا۔`;
    if(!(await customConfirm(msg))) return;
    trashPut('sale','بل: '+sale.invoiceNo,sale);
    (sale.items||[]).forEach(it=>{ const item=itemById(it.itemId); if(item) item.stock=(Number(item.stock)||0)+Number(it.qty||0); });
    DB.sales=DB.sales.filter(s=>s.id!==id);
  } else {
    const p=DB.purchases.find(x=>x.id===id); if(!p) return;
    const n=purchaseItems(p).length;
    const msg = n>1
      ? `یہ پوری خریداری حذف ہو گی جس میں ${n} آئٹمز ہیں۔ سب کا اسٹاک واپس کم ہو جائے گا۔ جاری رکھیں؟`
      : `یہ خریداری حذف کرنا چاہتے ہیں؟ اسٹاک واپس کم ہو جائے گا۔`;
    if(!(await customConfirm(msg))) return;
    trashPut('purchase','خریداری: '+purchaseItemsLabel(p),p);
    reverseStockForPurchase(p);
    DB.purchases=DB.purchases.filter(x=>x.id!==id);
  }
  await saveDB(); refreshFs(); toast('حذف ہو گیا (ری سائیکل بن میں محفوظ)');
}

async function saveQuickEntry(itemId,kind){
  if(!lockSubmit()) return;
  try{
    const it=itemById(itemId); if(!it) return;
    const isIn=kind==='in';
    const qty=parseFloat(document.getElementById('qe_qty').value)||0;
    const price=parseFloat(document.getElementById('qe_price').value)||0;
    if(qty<=0){ toast('صحیح مقدار لکھیں'); return; }
    const pay=document.getElementById('qe_pay').value;
    const partyId=document.getElementById('qe_party').value||null;
    const date=document.getElementById('qe_date').value||todayStr();
    const bankId = pay==='بینک' ? (document.getElementById('qe_bank').value||null) : null;
    if(pay==='بینک' && !bankId){ toast('بینک منتخب کریں'); return; }
    if(pay==='ادھار' && !partyId){ toast(isIn?'ادھار کے لیے سپلائر منتخب کریں':'ادھار کے لیے کسٹمر منتخب کریں'); return; }
    const total=qty*price;
    if(isIn){
      const sup=partyId?DB.suppliers.find(s=>s.id===partyId):null;
      const purchase={ id:uid(), createdAt:Date.now(), date, supplierId:partyId, supplier:sup?sup.name:'',
        items:[{itemId:it.id, name:it.name, qty, cost:price, detail:''}], itemsTotal:total, total,
        paymentType:pay, bankId, voiceNote:null };
      DB.purchases.push(purchase);
      applyStockForPurchase(purchase);
      saveDB(); closeSheet(); toast('✅ اسٹاک اِن ہو گیا');
    } else {
      if(qty>(Number(it.stock)||0)){ if(!(await customConfirm('اسٹاک سے زیادہ مقدار ہے، پھر بھی جاری رکھیں؟'))) return; }
      DB.invoiceCounter++;
      const invoiceNo='INV-'+String(DB.invoiceCounter).padStart(4,'0');
      const sale={ id:uid(), invoiceNo, date, createdAt:Date.now(), customerId:partyId,
        items:[{itemId:it.id, name:it.name, qty, price}],
        subtotal:total, discount:0, netTotal:total,
        paymentType:pay, bankId, signature:null, billImage:null };
      DB.sales.push(sale);
      it.stock=(Number(it.stock)||0)-qty;
      saveDB(); closeSheet(); toast('✅ اسٹاک آؤٹ ہو گیا — '+invoiceNo);
    }
  } finally { unlockSubmit(); }
}

async function pickPhoneContact(){
  if(!('contacts' in navigator) || !('ContactsManager' in window)){

function computeCustomerLedger(id){
  const c=custById(id);
  const due=custDue(c);
  const txns=[];
  DB.sales.filter(s=>s.customerId===id).forEach(s=>txns.push({date:s.date,ts:s.createdAt||0,desc:s.invoiceNo+' — '+s.paymentType,amt:s.netTotal,type:'sale',id:s.id}));
  DB.collections.filter(x=>x.customerId===id).forEach(x=>{
    const isGiven = x.type==='given';
    const payTag = x.paymentType ? ' ('+x.paymentType+(x.paymentType==='بینک'&&x.bankId?' — '+(bankById(x.bankId)?bankById(x.bankId).name:''):'')+')' : '';
    txns.push({date:x.date,ts:x.createdAt||0,desc:(isGiven?'رقم دی':'وصولی')+payTag+(x.notes?' — '+x.notes:''),amt:isGiven?x.amount:-x.amount,type:'col',id:x.id});
  });
  const asc = txns.slice().sort((a,b)=> a.date>b.date?1 : a.date<b.date?-1 : (a.ts-b.ts));
  let running = c.openingDue||0;
  asc.forEach(t=>{ running += t.amt; t.balance = running; });
  const totalGiven = txns.filter(t=>t.amt>0).reduce((s,t)=>s+t.amt,0);
  const totalReceived = txns.filter(t=>t.amt<0).reduce((s,t)=>s+Math.abs(t.amt),0);
  return { c, due, asc, totalGiven, totalReceived };
}

async function exportHtmlAsPdf(html, filename){
  const holder = document.createElement('div');
  holder.style.position='fixed'; holder.style.left='-99999px'; holder.style.top='0';
  holder.innerHTML = html;
  document.body.appendChild(holder);
  const target = holder.querySelector('#pdfCapture') || holder;
  try{
    const canvas = await html2canvas(target, {scale:2, backgroundColor:'#ffffff', useCORS:true});
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF('p','pt','a4');
    const pageW = pdf.internal.pageSize.getWidth();
    const pageH = pdf.internal.pageSize.getHeight();
    const imgW = pageW;
    const imgH = canvas.height * (imgW/canvas.width);
    let heightLeft = imgH, position = 0;
    const imgData = canvas.toDataURL('image/png');
    pdf.addImage(imgData, 'PNG', 0, position, imgW, imgH);
    heightLeft -= pageH;
    while(heightLeft > 0){
      position = heightLeft - imgH;
      pdf.addPage();
      pdf.addImage(imgData, 'PNG', 0, position, imgW, imgH);
      heightLeft -= pageH;
    }
    const blob = pdf.output('blob');
    document.body.removeChild(holder);
    return { blob, filename };
  } catch(e){
    document.body.removeChild(holder);
    console.error('PDF export failed', e);
    toast('PDF بنانے میں مسئلہ ہوا');
    return null;
  }
}
async function sharePdfBlob(blob, filename){
  const file = new File([blob], filename, {type:'application/pdf'});
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{
      await navigator.share({files:[file], title:filename});
      return;
    }catch(e){ /* user cancelled share sheet */ return; }
  }
  // Fallback: download the file, then user can attach it manually in WhatsApp.
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 5000);
  toast('PDF ڈاؤن لوڈ ہو گئی — واٹس ایپ میں فائل کے طور پر خود اٹیچ کر لیں');
}

    : `<input type="file" accept="image/*" capture="environment" id="amPhotoInputCam" style="display:none;" onchange="captureAmPhoto(this)">

function captureAmPhoto(input){
  const file=input.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=function(e){
    const img=new Image();
    img.onload=function(){
      const maxW=700; const scale=Math.min(1,maxW/img.width);
      const cv=document.createElement('canvas'); cv.width=img.width*scale; cv.height=img.height*scale;
      cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
      amPhoto=cv.toDataURL('image/jpeg',0.6);
      const wrap=document.getElementById('am_photo_wrap'); if(wrap) wrap.innerHTML=amPhotoWrapHtml();
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}
function initAmSignaturePad(){
  const canvas=document.getElementById('amSigPad');
  if(!canvas) return;
  const ratio=window.devicePixelRatio||1;
  canvas.width=canvas.clientWidth*ratio; canvas.height=canvas.clientHeight*ratio;
  const ctx=canvas.getContext('2d');
  ctx.scale(ratio,ratio); ctx.lineWidth=2; ctx.lineCap='round'; ctx.strokeStyle='#1a1a2e';
  if(amSignature){ const img=new Image(); img.onload=()=>ctx.drawImage(img,0,0,canvas.clientWidth,canvas.clientHeight); img.src=amSignature; }
  let drawing=false, last=null;
  function pos(e){ const r=canvas.getBoundingClientRect(); const t=e.touches?e.touches[0]:e; return {x:t.clientX-r.left, y:t.clientY-r.top}; }
  function start(e){ drawing=true; last=pos(e); e.preventDefault(); }
  function move(e){ if(!drawing) return; const p=pos(e); ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke(); last=p; e.preventDefault(); }
  function end(){ if(!drawing) return; drawing=false; amSignature=canvas.toDataURL('image/png'); }
  canvas.addEventListener('mousedown',start); canvas.addEventListener('mousemove',move); canvas.addEventListener('mouseup',end); canvas.addEventListener('mouseleave',end);
  canvas.addEventListener('touchstart',start); canvas.addEventListener('touchmove',move); canvas.addEventListener('touchend',end);
}
function clearAmSignature(){
  amSignature=null;
  const canvas=document.getElementById('amSigPad');
  if(canvas){ const ctx=canvas.getContext('2d'); ctx.clearRect(0,0,canvas.width,canvas.height); }
}
function setAmanatType(t){

async function saveAmanatEntry(personId,entryId){
  if(!lockSubmit()) return;
  try{
  const amount=parseFloat(document.getElementById('am_amt').value)||0;
  if(amount<=0){ toast('صحیح رقم لکھیں'); return; }
  const type=document.getElementById('am_type').value;
  const date=document.getElementById('am_date').value||todayStr();
  const notes=document.getElementById('am_notes').value.trim();
  const paymentType=document.getElementById('am_pay').value||'نقد';
  const bankId=paymentType==='بینک' ? (document.getElementById('am_bank').value||null) : null;
  if(paymentType==='بینک' && !bankId){ toast('پہلے بینک اکاؤنٹ شامل کریں'); return; }
  if(entryId){
    const e=DB.amanatEntries.find(x=>x.id===entryId);
    if(e){ e.amount=amount; e.type=type; e.date=date; e.notes=notes; e.photo=amPhoto||null; e.signature=amSignature||null; e.paymentType=paymentType; e.bankId=bankId; }
  } else {
    DB.amanatEntries.push({id:uid(), createdAt:Date.now(), personId, amount, type, date, notes, photo:amPhoto||null, signature:amSignature||null, paymentType, bankId});
  }
  amPhoto=null; amSignature=null;
  await saveDB(); closeSheet(); openAmanatDetail(personId); toast('محفوظ ہو گیا');
  } finally { unlockSubmit(); }
}
async function deleteAmanatEntry(personId,entryId){
  if(!(await customConfirm('یہ انٹری حذف کرنا چاہتے ہیں؟'))) return;
  const e=DB.amanatEntries.find(x=>x.id===entryId);
  if(e) trashPut('amanatEntry', 'امانت انٹری: '+money(e.amount), e);
  DB.amanatEntries=DB.amanatEntries.filter(x=>x.id!==entryId);
  await saveDB(); openAmanatDetail(personId); toast('حذف ہو گئی (ری سائیکل بن میں محفوظ)');
}

/* ===================== RECYCLE BIN ===================== */
function trashPut(type, label, data){
  DB.trash = DB.trash||[];
  DB.trash.unshift({ id:uid(), type, label, data, deletedAt:Date.now() });
  if(DB.trash.length>200) DB.trash.length=200;
}
function trashTimeAgo(ts){
  const mins=Math.floor((Date.now()-ts)/60000);
  if(mins<1) return 'ابھی ابھی';
  if(mins<60) return mins+' منٹ پہلے';
  const hrs=Math.floor(mins/60);
  if(hrs<24) return hrs+' گھنٹے پہلے';
  return Math.floor(hrs/24)+' دن پہلے';
}
function renderTrash(main){
  const items = DB.trash||[];
  main.innerHTML = `
    <button class="btn btn-outline" style="margin-bottom:10px;" onclick="backToMoreMenu()">‹ واپس</button>
    <div class="card">
      ${items.length? items.map(t=>`
        <div class="list-item">
          <div><div class="name">${esc(t.label)}</div><div class="meta">${trashTimeAgo(t.deletedAt)}</div></div>
          <div style="display:flex;gap:8px;">
            <button class="btn btn-outline btn-sm" onclick="restoreFromTrash('${t.id}')">↩️ بحال کریں</button>
            <button class="btn btn-red btn-sm" onclick="permanentDeleteTrash('${t.id}')">حذف</button>
          </div>
        </div>`).join('')
      : `<div class="empty">ری سائیکل بن خالی ہے</div>`}
    </div>
  `;
}
async function permanentDeleteTrash(trashId){
  if(!(await customConfirm('اسے ہمیشہ کے لیے حذف کرنا چاہتے ہیں؟ یہ واپس نہیں آئے گا۔'))) return;
  DB.trash = (DB.trash||[]).filter(t=>t.id!==trashId);
  await saveDB(); renderTrash(document.getElementById('main')); toast('ہمیشہ کے لیے حذف ہو گیا');
}
async function restoreFromTrash(trashId){
  const t = (DB.trash||[]).find(x=>x.id===trashId);
  if(!t) return;
  const d = t.data;
  if(t.type==='customer'){
    DB.customers.push(d.customer);
    (d.sales||[]).forEach(s=>{ DB.sales.push(s); (s.items||[]).forEach(it=>{ const item=itemById(it.itemId); if(item) item.stock=(Number(item.stock)||0)-Number(it.qty||0); }); });
    (d.collections||[]).forEach(c=>DB.collections.push(c));
  } else if(t.type==='item'){
    DB.items.push(d);
  } else if(t.type==='bank'){
    DB.banks.push(d.bank);
    (d.bankEntries||[]).forEach(e=>DB.bankEntries.push(e));
    (d.sales||[]).forEach(s=>{ DB.sales.push(s); (s.items||[]).forEach(it=>{ const item=itemById(it.itemId); if(item) item.stock=(Number(item.stock)||0)-Number(it.qty||0); }); });
    (d.purchases||[]).forEach(p=>{ DB.purchases.push(p); applyStockForPurchase(p); });
  } else if(t.type==='sale'){
    DB.sales.push(d);
    (d.items||[]).forEach(it=>{ const item=itemById(it.itemId); if(item) item.stock=(Number(item.stock)||0)-Number(it.qty||0); });
  } else if(t.type==='collection'){
    DB.collections.push(d);
  } else if(t.type==='cash'){
    DB.cashEntries.push(d);
  } else if(t.type==='purchase'){
    DB.purchases.push(d);
    applyStockForPurchase(d);
  } else if(t.type==='amanatPerson'){
    DB.amanatPersons.push(d.person);
    (d.entries||[]).forEach(e=>DB.amanatEntries.push(e));
  } else if(t.type==='amanatEntry'){
    DB.amanatEntries.push(d);
  }
  DB.trash = (DB.trash||[]).filter(x=>x.id!==trashId);
  await saveDB(); renderTrash(document.getElementById('main')); toast('بحال ہو گیا');
}

async function savePurchase(id){
  if(!lockSubmit()) return;
  try{
  const itemId=document.getElementById('p_item').value;
  const qty=parseFloat(document.getElementById('p_qty').value)||0;
  const cost=parseFloat(document.getElementById('p_cost').value)||0;
  if(!itemId||qty<=0){ toast('آئٹم اور مقدار درست لکھیں'); return; }
  const it=itemById(itemId);
  const pay=document.getElementById('p_pay').value;
  const supplierId=document.getElementById('p_supplierId').value||null;
  if(pay==='ادھار' && !supplierId){ toast('ادھار کے لیے سپلائر منتخب کریں'); return; }
  const supplierName = supplierId ? DB.suppliers.find(s=>s.id===supplierId).name : document.getElementById('p_supplier').value.trim();
  if(id){
    const old=DB.purchases.find(x=>x.id===id);
    if(old){
      const oldItem=itemById(old.itemId);
      if(oldItem) oldItem.stock=(Number(oldItem.stock)||0)-Number(old.qty||0);
      old.date=document.getElementById('p_date').value||todayStr();
      old.supplier=supplierName; old.supplierId=supplierId;
      old.itemId=itemId; old.itemName=it.name; old.qty=qty; old.cost=cost; old.total=qty*cost;
      old.paymentType=pay; old.bankId=pay==='بینک'?document.getElementById('p_bank').value:null;
      it.stock=(Number(it.stock)||0)+qty;
    }
  } else {
    const purchase={id:uid(), createdAt:Date.now(), date:document.getElementById('p_date').value||todayStr(),
      supplier:supplierName, supplierId, itemId, itemName:it.name, qty, cost,
      total:qty*cost, paymentType:pay, bankId: pay==='بینک'?document.getElementById('p_bank').value:null};
    DB.purchases.push(purchase);
    it.stock=(Number(it.stock)||0)+qty;
  }
  await saveDB(); closeSheet(); renderPurchases(document.getElementById('main')); toast('خریداری محفوظ ہو گئی');
  } finally { unlockSubmit(); }
}
async function deletePurchase(id){
  if(!(await customConfirm('یہ خریداری حذف کرنا چاہتے ہیں؟ اسٹاک واپس کم ہو جائے گا۔'))) return;
  const p=DB.purchases.find(x=>x.id===id);
  if(p){
    trashPut('purchase', 'خریداری: '+purchaseItemsLabel(p), p);
    reverseStockForPurchase(p);
  }
  DB.purchases=DB.purchases.filter(x=>x.id!==id);
  await saveDB(); renderPurchases(document.getElementById('main')); toast('حذف ہو گئی (ری سائیکل بن میں محفوظ)');
}

function calcPadHTML(){
  return `
  <div class="calc-pad">
    <button class="calc-btn func" onclick="calcClear()">AC</button>
    <button class="calc-btn func" onclick="calcBackspace()">⌫</button>
    <button class="calc-btn func" onclick="calcPercent()">%</button>
    <button class="calc-btn op" onclick="calcPress('÷')">÷</button>
    <button class="calc-btn" onclick="calcPress('7')">7</button>
    <button class="calc-btn" onclick="calcPress('8')">8</button>
    <button class="calc-btn" onclick="calcPress('9')">9</button>
    <button class="calc-btn op" onclick="calcPress('×')">×</button>
    <button class="calc-btn" onclick="calcPress('4')">4</button>
    <button class="calc-btn" onclick="calcPress('5')">5</button>
    <button class="calc-btn" onclick="calcPress('6')">6</button>
    <button class="calc-btn op" onclick="calcPress('−')">−</button>
    <button class="calc-btn" onclick="calcPress('1')">1</button>
    <button class="calc-btn" onclick="calcPress('2')">2</button>
    <button class="calc-btn" onclick="calcPress('3')">3</button>
    <button class="calc-btn op" onclick="calcPress('+')">+</button>
    <button class="calc-btn" style="grid-column:span 2;" onclick="calcPress('0')">0</button>
    <button class="calc-btn" onclick="calcPress('.')">.</button>
    <button class="calc-btn eq" onclick="calcEquals()">=</button>
  </div>`;
}
function updateCalcDisplay(){
  const disp=document.getElementById('pAmountDisplay');
  if(disp) disp.textContent = pCalcExpr!=='' ? pCalcExpr : money(pDisplayTotal());
}
function calcPress(ch){ pCalcExpr += ch; updateCalcDisplay(); }
function calcClear(){ pCalcExpr=''; pAmountOverride=null; updateCalcDisplay(); }
function calcBackspace(){ if(pCalcExpr) pCalcExpr=pCalcExpr.slice(0,-1); else pAmountOverride=null; updateCalcDisplay(); }
function calcPercent(){
  const m=pCalcExpr.match(/(\d*\.?\d+)$/);
  if(!m) return;
  const num=(parseFloat(m[0])/100);
  pCalcExpr = pCalcExpr.slice(0,m.index) + num;
  updateCalcDisplay();
}
function calcEquals(){
  if(!pCalcExpr) return;
  const safe = pCalcExpr.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-');
  if(!/^[0-9+\-*/.() ]+$/.test(safe)){ toast('غلط اندراج'); return; }
  let result;
  try{ result = Function('"use strict";return ('+safe+')')(); }catch(e){ toast('غلط اندراج'); return; }
  if(typeof result!=='number' || !isFinite(result)){ toast('غلط اندراج'); return; }
  result = Math.round(result*100)/100;
  pAmountOverride = result;
  pCalcExpr = String(result);
  updateCalcDisplay();
}

/* ---- voice note ---- */
async function toggleVoiceRecording(){
  if(pRecording){ if(pMediaRecorder) pMediaRecorder.stop(); return; }
  if(!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)){ toast('اس براؤزر پر مائیک دستیاب نہیں'); return; }
  try{
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    pAudioChunks=[];
    pMediaRecorder = new MediaRecorder(stream);
    pMediaRecorder.ondataavailable = e=>{ if(e.data && e.data.size) pAudioChunks.push(e.data); };
    pMediaRecorder.onstop = ()=>{
      const blob = new Blob(pAudioChunks, {type:'audio/webm'});
      const reader = new FileReader();
      reader.onload = ()=>{ pVoiceNote = reader.result; pRecording=false; stream.getTracks().forEach(t=>t.stop()); renderPurchaseEntryScreen(); };
      reader.readAsDataURL(blob);
    };
    pMediaRecorder.start();
    pRecording=true;
    renderPurchaseEntryScreen();
  }catch(e){ toast('مائیک تک رسائی نہیں مل سکی'); }
}
function playVoiceNote(){ if(pVoiceNote){ new Audio(pVoiceNote).play(); } }
function deleteVoiceNote(){ pVoiceNote=null; renderPurchaseEntryScreen(); }

/* ---- save ---- */
async function savePurchaseEntry(){
  if(!lockSubmit()) return;
  try{
  const total = pDisplayTotal();
  if(total<=0 && !pCart.length){ toast('رقم یا آئٹمز درج کریں'); return; }
  const pay = document.getElementById('pe_pay').value;
  let supplierId = pSupplierId;
  let supplierName = '';
  if(!supplierId){
    const sel=document.getElementById('pe_supplierId');
    supplierId = sel && sel.value ? sel.value : null;
  }
  if(pay==='ادھار' && !supplierId){ toast('ادھار کے لیے سپلائر منتخب کریں'); return; }
  if(supplierId){ const s=DB.suppliers.find(x=>x.id===supplierId); supplierName = s?s.name:''; }
  else{ const nameInp=document.getElementById('pe_supplierName'); supplierName = nameInp?nameInp.value.trim():''; }
  const date = document.getElementById('pe_date').value || todayStr();
  const bankId = pay==='بینک' ? document.getElementById('pe_bank').value : null;
  const items = pCart.map(c=>({itemId:c.itemId, name:c.name, qty:Number(c.qty)||0, cost:Number(c.cost)||0, detail:c.detail||''}));
  if(pEditId){
    const old=DB.purchases.find(x=>x.id===pEditId);
    if(old){
      reverseStockForPurchase(old);
      old.date=date; old.supplierId=supplierId; old.supplier=supplierName;
      old.items=items; old.itemId=null; old.itemName=null; old.qty=null; old.cost=null;
      old.itemsTotal=pCartTotal(); old.total=total;
      old.paymentType=pay; old.bankId=bankId;
      old.voiceNote=pVoiceNote||null;
      applyStockForPurchase(old);
    }
  } else {
    const purchase={ id:uid(), createdAt:Date.now(), date, supplierId, supplier:supplierName,
      items, itemsTotal:pCartTotal(), total, paymentType:pay, bankId, voiceNote:pVoiceNote||null };
    DB.purchases.push(purchase);
    applyStockForPurchase(purchase);
  }
  await saveDB(); closeSheet(); toast('خریداری محفوظ ہو گئی');
  resetPurchaseEntryState();
  if(supplierId) openSupplierDetail(supplierId);
  else renderPurchases(document.getElementById('main'));
  } finally { unlockSubmit(); }
}

/* ===================== SUPPLIERS (ادھار خریداری) ===================== */
function supplierDue(supplierId){
  let due = 0;
  DB.purchases.forEach(p=>{ if(p.supplierId===supplierId && p.paymentType==='ادھار') due += Number(p.total)||0; });
  DB.supplierPayments.forEach(pay=>{ if(pay.supplierId===supplierId) due -= Number(pay.amount)||0; });
  return due;
}
function supplierOldestDueDays(supplierId){
  const unpaidDates = DB.purchases.filter(p=>p.supplierId===supplierId && p.paymentType==='ادھار').map(p=>p.date);
  if(!unpaidDates.length) return null;
  const oldest = unpaidDates.sort()[0];
  const days = Math.floor((Date.now() - new Date(oldest).getTime())/86400000);
  return days>=0 ? days : 0;
}

let supplierDetailSearch='';
function computeSupplierTxns(id){
  const txns=[];
  DB.purchases.filter(p=>p.supplierId===id).forEach(p=>{
    txns.push({date:p.date, ts:p.createdAt||0, kind:'purchase',
      desc:purchaseItemsLabel(p)+(p.paymentType!=='ادھار'?' ('+p.paymentType+')':''),
      amt:Number(p.total)||0, affectsDue:p.paymentType==='ادھار', id:p.id, voiceNote:p.voiceNote||null});
  });
  DB.supplierPayments.filter(x=>x.supplierId===id).forEach(x=>{
    txns.push({date:x.date, ts:x.createdAt||0, kind:'payment', desc:'ادائیگی'+(x.notes?' — '+x.notes:''), amt:Number(x.amount)||0, affectsDue:true, id:x.id});
  });
  const asc = txns.slice().sort((a,b)=> a.date>b.date?1 : a.date<b.date?-1 : (a.ts-b.ts));
  let running=0;
  asc.forEach(t=>{ if(t.affectsDue) running += (t.kind==='purchase'? t.amt : -t.amt); t.balance=running; });
  return asc;
}
function supplierRowsHTML(id){
  const q=(supplierDetailSearch||'').trim().toLowerCase();
  let list = computeSupplierTxns(id).slice().reverse();
  if(q) list = list.filter(t=>t.desc.toLowerCase().includes(q));
  if(!list.length) return `<div class="empty">کوئی انٹری نہیں</div>`;
  return list.map(t=>`
    <div class="sup-row">
      <div class="sup-col">${t.kind==='payment'?`<span class="amt-red">${money(t.amt)}</span>`:''}</div>
      <div class="sup-col">${t.kind==='purchase'?`<span class="amt-green">${money(t.amt)}</span>`:''}</div>

function computeCashLedger(){
  const entries=[];
  DB.cashEntries.forEach(e=>entries.push({date:e.date,desc:e.desc,in:e.in,out:e.out,createdAt:e.createdAt||0,kind:'cash',id:e.id,signature:e.signature||null}));
  DB.sales.filter(s=>s.paymentType==='نقد').forEach(s=>entries.push({date:s.date,desc:'POS سیل — '+s.invoiceNo,in:s.netTotal,out:0,createdAt:s.createdAt,kind:'sale',id:s.id}));
  DB.purchases.filter(p=>p.paymentType==='نقد').forEach(p=>entries.push({date:p.date,desc:'خریداری — '+(p.supplier||''),in:0,out:p.total,createdAt:p.createdAt,kind:'purchase',id:p.id}));
  DB.collections.filter(x=>x.paymentType==='نقد').forEach(x=>{
    const c=custById(x.customerId);
    entries.push({date:x.date,desc:(x.type==='given'?'کسٹمر کو رقم دی — ':'کسٹمر سے وصولی — ')+(c?c.name:''),in:x.type==='given'?0:x.amount,out:x.type==='given'?x.amount:0,createdAt:x.createdAt||0,kind:'collection',id:x.id});
  });
  DB.amanatEntries.filter(x=>x.paymentType==='نقد').forEach(x=>{
    const p=DB.amanatPersons.find(a=>a.id===x.personId);
    entries.push({date:x.date,desc:(x.type==='in'?'امانت رکھی — ':'امانت واپس کی — ')+(p?p.name:''),in:x.type==='in'?x.amount:0,out:x.type==='in'?0:x.amount,createdAt:x.createdAt||0,kind:'amanat',id:x.id});
  });
  entries.sort((a,b)=>a.createdAt-b.createdAt);
  let bal=0;
  entries.forEach(e=>{ bal+=(Number(e.in)||0)-(Number(e.out)||0); e.balance=bal; });
  return entries;
}

function cashSigWrapHtml(type){
  if(type!=='out') return '';
  return `<label>وصول کنندہ کے دستخط (اختیاری — جب کسی کو رقم دیں)</label>
    <canvas id="cashSigPad" style="width:100%;height:120px;border:1.5px dashed var(--line);border-radius:10px;touch-action:none;background:#fff;"></canvas>
    <button type="button" class="btn btn-outline btn-sm" style="margin-top:8px;" onclick="clearCashSignature()">🧹 دستخط صاف کریں</button>`;
}
function initCashSignaturePad(){
  const canvas=document.getElementById('cashSigPad');
  if(!canvas) return;
  const ratio=window.devicePixelRatio||1;
  canvas.width=canvas.clientWidth*ratio; canvas.height=canvas.clientHeight*ratio;
  const ctx=canvas.getContext('2d');
  ctx.scale(ratio,ratio); ctx.lineWidth=2; ctx.lineCap='round'; ctx.strokeStyle='#1a1a2e';
  if(cashSignature){ const img=new Image(); img.onload=()=>ctx.drawImage(img,0,0,canvas.clientWidth,canvas.clientHeight); img.src=cashSignature; }
  let drawing=false, last=null;
  function pos(e){ const r=canvas.getBoundingClientRect(); const t=e.touches?e.touches[0]:e; return {x:t.clientX-r.left, y:t.clientY-r.top}; }
  function start(e){ drawing=true; last=pos(e); e.preventDefault(); }
  function move(e){ if(!drawing) return; const p=pos(e); ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke(); last=p; e.preventDefault(); }
  function end(){ if(!drawing) return; drawing=false; cashSignature=canvas.toDataURL('image/png'); }
  canvas.addEventListener('mousedown',start); canvas.addEventListener('mousemove',move); canvas.addEventListener('mouseup',end); canvas.addEventListener('mouseleave',end);
  canvas.addEventListener('touchstart',start); canvas.addEventListener('touchmove',move); canvas.addEventListener('touchend',end);
}
function clearCashSignature(){
  cashSignature=null;
  const canvas=document.getElementById('cashSigPad');
  if(canvas){ const ctx=canvas.getContext('2d'); ctx.clearRect(0,0,canvas.width,canvas.height); }
}
function setCashType(t){
  document.getElementById('cash_type').value=t;
  document.getElementById('cash_in_btn').classList.toggle('on',t==='in');
  document.getElementById('cash_out_btn').classList.toggle('on',t==='out');
  const wrap=document.getElementById('cash_sig_wrap');
  if(wrap){ wrap.innerHTML=cashSigWrapHtml(t); if(t==='out') initCashSignaturePad(); }
}
async function saveCashEntry(entryId){
  if(!lockSubmit()) return;
  try{
  const amt=parseFloat(document.getElementById('cash_amt').value)||0;
  const type=document.getElementById('cash_type').value;
  if(amt<=0){ toast('صحیح رقم لکھیں'); return; }
  const desc=document.getElementById('cash_desc').value.trim()||'انٹری';
  const date=document.getElementById('cash_date').value||todayStr();
  const sig = type==='out' ? (cashSignature||null) : null;
  if(entryId){
    const e=DB.cashEntries.find(x=>x.id===entryId);
    if(e){ e.desc=desc; e.date=date; e.in=type==='in'?amt:0; e.out=type==='out'?amt:0; e.signature=sig; }
  } else {
    DB.cashEntries.push({id:uid(), createdAt:Date.now(), desc, date, in:type==='in'?amt:0, out:type==='out'?amt:0, signature:sig});
  }
  cashSignature=null;
  await saveDB(); closeSheet(); renderCash(document.getElementById('main')); toast('محفوظ ہو گیا');
  } finally { unlockSubmit(); }
}
async function deleteLedgerEntry(kind,id){
  if(!(await customConfirm('یہ انٹری حذف کرنا چاہتے ہیں؟'))) return;
  if(kind==='cash'){
    const e=DB.cashEntries.find(x=>x.id===id);
    if(e) trashPut('cash', 'کیش: '+e.desc, e);
    DB.cashEntries=DB.cashEntries.filter(e=>e.id!==id);
  } else if(kind==='sale'){
    const sale=DB.sales.find(s=>s.id===id);
    if(sale){ trashPut('sale','بل: '+sale.invoiceNo, sale); (sale.items||[]).forEach(it=>{ const item=itemById(it.itemId); if(item) item.stock=(Number(item.stock)||0)+Number(it.qty||0); }); }
    DB.sales=DB.sales.filter(s=>s.id!==id);
  } else if(kind==='purchase'){
    const purchase=DB.purchases.find(p=>p.id===id);
    if(purchase){ trashPut('purchase','خریداری: '+purchaseItemsLabel(purchase), purchase); reverseStockForPurchase(purchase); }
    DB.purchases=DB.purchases.filter(p=>p.id!==id);
  }
  await saveDB(); renderCash(document.getElementById('main')); toast('انٹری حذف ہو گئی (ری سائیکل بن میں محفوظ)');
}

function computeBankLedger(bankId){
  const b=bankById(bankId);
  const entries=[];
  DB.bankEntries.filter(e=>e.bankId===bankId).forEach(e=>entries.push({date:e.date,desc:e.desc,in:e.in,out:e.out,createdAt:e.createdAt||0,kind:'bankEntry',id:e.id,photo:e.photo||null}));
  DB.sales.filter(s=>s.paymentType==='بینک'&&s.bankId===bankId).forEach(s=>entries.push({date:s.date,desc:'POS سیل — '+s.invoiceNo,in:s.netTotal,out:0,createdAt:s.createdAt,kind:'sale',id:s.id}));
  DB.purchases.filter(p=>p.paymentType==='بینک'&&p.bankId===bankId).forEach(p=>entries.push({date:p.date,desc:'خریداری',in:0,out:p.total,createdAt:p.createdAt,kind:'purchase',id:p.id}));
  DB.collections.filter(x=>x.paymentType==='بینک'&&x.bankId===bankId).forEach(x=>{
    const c=custById(x.customerId);
    entries.push({date:x.date,desc:(x.type==='given'?'کسٹمر کو رقم دی — ':'کسٹمر سے وصولی — ')+(c?c.name:''),in:x.type==='given'?0:x.amount,out:x.type==='given'?x.amount:0,createdAt:x.createdAt||0,kind:'collection',id:x.id});
  });
  DB.amanatEntries.filter(x=>x.paymentType==='بینک'&&x.bankId===bankId).forEach(x=>{
    const p=DB.amanatPersons.find(a=>a.id===x.personId);
    entries.push({date:x.date,desc:(x.type==='in'?'امانت رکھی — ':'امانت واپس کی — ')+(p?p.name:''),in:x.type==='in'?x.amount:0,out:x.type==='in'?0:x.amount,createdAt:x.createdAt||0,kind:'amanat',id:x.id});
  });
  entries.sort((a,b)=>a.createdAt-b.createdAt);
  let bal=0;
  entries.forEach(e=>{ bal+=(Number(e.in)||0)-(Number(e.out)||0); e.balance=bal; });
  return { b, entries };
}

function renderBankReport(bankId){
  const {b, entries} = computeBankLedger(bankId);
  let filtered = entries.slice();
  if(bankReportFrom) filtered = filtered.filter(e=>e.date>=bankReportFrom);
  if(bankReportTo) filtered = filtered.filter(e=>e.date<=bankReportTo);
  if(bankReportSearch.trim()){
    const q=bankReportSearch.trim().toLowerCase();
    filtered = filtered.filter(e=>e.desc.toLowerCase().includes(q));
  }
  const totalIn = filtered.reduce((s,e)=>s+(Number(e.in)||0),0);
  const totalOut = filtered.reduce((s,e)=>s+(Number(e.out)||0),0);
  const rows = filtered.slice().reverse().map(e=>`

      <div class="stat warn"><div class="label">کل نکلوائی</div><div class="value" style="font-size:16px;">${money(totalOut)}</div></div>

async function deleteBank(bankId){
  const hasEntries = DB.bankEntries.some(e=>e.bankId===bankId) || DB.sales.some(s=>s.bankId===bankId) || DB.purchases.some(p=>p.bankId===bankId);
  const msg = hasEntries
    ? 'اس بینک اکاؤنٹ کی تمام انٹریاں اور اس سے جڑے بل بھی حذف ہو جائیں گے۔ یقینی بنائیں؟'
    : 'یہ بینک اکاؤنٹ حذف کرنا چاہتے ہیں؟';
  if(!(await customConfirm(msg))) return;
  const bank=DB.banks.find(b=>b.id===bankId);
  const relEntries=DB.bankEntries.filter(e=>e.bankId===bankId);
  const relSales=DB.sales.filter(s=>s.bankId===bankId);
  const relPurchases=DB.purchases.filter(p=>p.bankId===bankId);
  if(bank) trashPut('bank', 'بینک: '+bank.name, { bank, bankEntries:relEntries, sales:relSales, purchases:relPurchases });
  relSales.forEach(s=>{ (s.items||[]).forEach(it=>{ const item=itemById(it.itemId); if(item) item.stock=(Number(item.stock)||0)+Number(it.qty||0); }); });
  relPurchases.forEach(p=>{ const item=itemById(p.itemId); if(item) item.stock=(Number(item.stock)||0)-Number(p.qty||0); });
  DB.sales=DB.sales.filter(s=>s.bankId!==bankId);
  DB.purchases=DB.purchases.filter(p=>p.bankId!==bankId);
  DB.bankEntries=DB.bankEntries.filter(e=>e.bankId!==bankId);
  DB.banks=DB.banks.filter(b=>b.id!==bankId);
  await saveDB(); closeSheet(); renderBanks(document.getElementById('main')); toast('بینک اکاؤنٹ حذف ہو گیا (ری سائیکل بن میں محفوظ)');
}
async function deleteBankLedgerEntry(kind,id,bankId){
  if(!(await customConfirm('یہ انٹری حذف کرنا چاہتے ہیں؟'))) return;
  if(kind==='bankEntry'){
    DB.bankEntries=DB.bankEntries.filter(e=>e.id!==id);
  } else if(kind==='sale'){
    const sale=DB.sales.find(s=>s.id===id);
    if(sale){ (sale.items||[]).forEach(it=>{ const item=itemById(it.itemId); if(item) item.stock=(Number(item.stock)||0)+Number(it.qty||0); }); }
    DB.sales=DB.sales.filter(s=>s.id!==id);
  } else if(kind==='purchase'){
    const purchase=DB.purchases.find(p=>p.id===id);
    if(purchase){ reverseStockForPurchase(purchase); }
    DB.purchases=DB.purchases.filter(p=>p.id!==id);
  }
  await saveDB(); openBankDetail(bankId); toast('انٹری حذف ہو گئی');
}

function captureBePhoto(input){
  const file=input.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=function(e){
    const img=new Image();
    img.onload=function(){
      const maxW=700; const scale=Math.min(1,maxW/img.width);
      const cv=document.createElement('canvas'); cv.width=img.width*scale; cv.height=img.height*scale;
      cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
      bePhoto=cv.toDataURL('image/jpeg',0.6);
      const wrap=document.getElementById('be_photo_wrap'); if(wrap) wrap.innerHTML=bePhotoWrapHtml();
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

async function saveBankEntry(bankId,entryId){

  const type=document.getElementById('be_type').value;
  if(amt<=0){ toast('صحیح رقم لکھیں'); return; }
  const desc=document.getElementById('be_desc').value.trim()||'انٹری';
  const date=document.getElementById('be_date').value||todayStr();
  if(entryId){
    const e=DB.bankEntries.find(x=>x.id===entryId);
    if(e){ e.desc=desc; e.date=date; e.in=type==='in'?amt:0; e.out=type==='out'?amt:0; e.photo=bePhoto||null; }
  } else {
    DB.bankEntries.push({id:uid(), createdAt:Date.now(), bankId, desc, date, in:type==='in'?amt:0, out:type==='out'?amt:0, photo:bePhoto||null});
  }
  bePhoto=null;
  await saveDB(); closeSheet(); openBankDetail(bankId); toast('محفوظ ہو گیا');
  } finally { unlockSubmit(); }
}
