/* Custom confirm dialog — replaces native confirm() which can be blocked
   inside sandboxed webviews (some file-preview/browser embeds silently
   suppress alert()/confirm()/prompt()). Returns a Promise<boolean>. */
function customConfirm(message){
  return new Promise(function(resolve){
    const root=document.getElementById('confirmRoot');
    function done(val){ root.innerHTML=''; resolve(val); }
    root.innerHTML = `
      <div class="confirm-overlay">
        <div class="confirm-box">
          <p>${esc(message)}</p>
          <div class="btn-row">
            <button class="btn btn-outline" id="cc_cancel">منسوخ کریں</button>
            <button class="btn btn-red" id="cc_ok">تصدیق کریں</button>
          </div>
        </div>
      </div>`;
    document.getElementById('cc_ok').onclick=()=>done(true);
    document.getElementById('cc_cancel').onclick=()=>done(false);
  });
}

/* ===================== BARCODE CAMERA SCANNER ===================== */
let scannerCallback=null;
let scannerBusy=false;
let scanCandidateCode=null, scanCandidateCount=0;
function openBarcodeScanner(callback){
  scannerCallback=callback; scannerBusy=false; scanCandidateCode=null; scanCandidateCount=0;
  const root=document.getElementById('scannerRoot');
  root.innerHTML = `
    <div class="overlay" style="align-items:center;">
      <div class="sheet" style="max-height:82vh;padding:14px;">
        <div class="sheethead"><h2>📷 بار کوڈ اسکین کریں</h2><button class="closebtn" onclick="closeScanner()">✕</button></div>
        <div id="scannerViewport"><div class="scan-line"></div></div>
        <div style="text-align:center;color:var(--muted);font-size:12px;margin-top:8px;">بارکوڈ کو کیمرے کے سامنے رکھیں</div>
        <button class="btn btn-outline" style="margin-top:10px;" onclick="closeScanner()">منسوخ کریں</button>
      </div>
    </div>`;
  if(typeof Quagga==='undefined'){
    toast('کیمرہ اسکینر لوڈ نہیں ہو سکا — انٹرنیٹ کنکشن چیک کریں');
    return;
  }
  if(!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)){
    toast('اس براؤزر/صفحے پر کیمرہ دستیاب نہیں (https والا لنک استعمال کریں)');
    return;
  }
  Quagga.init({
    inputStream:{
      name:"Live",
      type:"LiveStream",
      target: document.getElementById('scannerViewport'),
      constraints:{ facingMode:"environment", width:{ideal:640}, height:{ideal:480} }
    },
    locator:{ patchSize:"medium", halfSample:true },
    numOfWorkers: 2,
    decoder:{ readers:["ean_reader","ean_8_reader","code_128_reader","code_39_reader","upc_reader","upc_e_reader"] },
    locate:true
  }, function(err){
    if(err){ console.error(err); toast('کیمرہ کھولنے میں مسئلہ — پرمیشن چیک کریں'); closeScanner(); return; }
    Quagga.start();
  });
  Quagga.offDetected();
  Quagga.onDetected(onBarcodeDetected);
}
function playBeep(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const osc = ctx.createOscillator(); const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.type='sine'; osc.frequency.value=1500;
    gain.gain.setValueAtTime(0.25, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+0.15);
    osc.start(); osc.stop(ctx.currentTime+0.15);
    setTimeout(()=>ctx.close(), 300);
  }catch(e){}
}
function onBarcodeDetected(result){
  if(scannerBusy) return;
  const code = result && result.codeResult ? result.codeResult.code : null;
  if(!code) return;
  // Require the same code to be read 3 times in a row before accepting it —
  // a single camera frame can misread a digit, this filters that out.
  if(code===scanCandidateCode){
    scanCandidateCount++;
  } else {
    scanCandidateCode=code; scanCandidateCount=1;
  }
  if(scanCandidateCount<2) return;
  scannerBusy=true;
  playBeep();
  if(navigator.vibrate) navigator.vibrate(120);
  const cb=scannerCallback;
  closeScanner();
  if(cb) cb(code);
}
function closeScanner(){
  try{ if(typeof Quagga!=='undefined'){ Quagga.offDetected(); Quagga.stop(); } }catch(e){}
  const root=document.getElementById('scannerRoot');
  if(root) root.innerHTML='';
  scannerCallback=null;
}
function esc(s){ if(s===undefined||s===null) return ''; return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ===================== PIN LOCK ===================== */
const UNLOCK_KEY='aghajan_unlocked_v1';
let hiddenAt=0;
document.addEventListener('visibilitychange', function(){
  if(document.hidden){ hiddenAt=Date.now(); }
  else if(hiddenAt && DB && DB.shop && DB.shop.pin){
    // Re-require the PIN if the app was backgrounded for more than ~15 seconds,
    // so leaving/switching apps or locking the screen re-locks it.
    if(Date.now()-hiddenAt > 15000){
      sessionStorage.removeItem(UNLOCK_KEY);
      lockMode='enter'; lockEntered=''; lockErr='';
      renderLockScreen();
    }
    hiddenAt=0;
  }
});
let lockEntered='';
let lockMode='enter'; // 'enter' | 'setNew' | 'confirmNew' | 'changeOld'
let lockTempPin='';
let lockErr='';

function isLocked(){
  return !!(DB.shop.pin) && sessionStorage.getItem(UNLOCK_KEY)!=='1';
}
function showAppUI(show){
  document.getElementById('app').style.display = show?'':'none';
}
function renderLockScreen(){
  showAppUI(false);
  const dots = [0,1,2,3].map(i=>`<span class="${i<lockEntered.length?'filled':''}"></span>`).join('');
  const root=document.getElementById('lockRoot');
  root.innerHTML = `
    <div class="lockwrap">
      <div class="lock-logo">🔒</div>
      <h2>پن درج کریں</h2>
      <div class="sub">${esc(DB.shop.name)}</div>
      <div class="lock-dots">${dots}</div>
      <div class="lock-err">${esc(lockErr)}</div>
      <div class="lock-keypad">
        ${[1,2,3,4,5,6,7,8,9].map(n=>`<button onclick="lockPress('${n}')">${n}</button>`).join('')}
        <button class="wide" onclick="lockBackspace()">⌫</button>
        <button onclick="lockPress('0')">0</button>
        <div></div>
      </div>
      ${lockMode!=='enter' ? `<button class="btn btn-outline" style="margin-top:22px;max-width:220px;" onclick="lockCancelSetup()">منسوخ کریں</button>` : ''}
    </div>`;
}
function lockCancelSetup(){
  lockMode='enter'; lockEntered=''; lockTempPin=''; lockErr='';
  document.getElementById('lockRoot').innerHTML='';
  showAppUI(true);
}
function lockPress(d){
  if(lockEntered.length>=4) return;
  lockEntered+=d; lockErr='';
  if(lockEntered.length===4) setTimeout(lockPinSubmit, 120);
  renderLockScreen();
}
function lockBackspace(){ lockEntered=lockEntered.slice(0,-1); renderLockScreen(); }
function lockPinSubmit(){
  if(lockMode==='enter'){
    if(lockEntered===DB.shop.pin){
      sessionStorage.setItem(UNLOCK_KEY,'1');
      document.getElementById('lockRoot').innerHTML='';
      showAppUI(true);
    }else{
      lockErr='غلط پن، دوبارہ کوشش کریں'; lockEntered=''; renderLockScreen();
    }
  }else if(lockMode==='changeOld'){
    if(lockEntered===DB.shop.pin){
      lockMode='setNew'; lockEntered=''; lockErr='نیا پن منتخب کریں (4 ہندسے)'; renderLockScreen();
    }else{
      lockErr='غلط پن، دوبارہ کوشش کریں'; lockEntered=''; renderLockScreen();
    }
  }else if(lockMode==='setNew'){
    lockTempPin=lockEntered; lockEntered=''; lockMode='confirmNew'; lockErr='دوبارہ پن درج کریں';
    renderLockScreen();
  }else if(lockMode==='confirmNew'){
    if(lockEntered===lockTempPin){
      DB.shop.pin=lockEntered; saveDB();
      sessionStorage.setItem(UNLOCK_KEY,'1');
      lockMode='enter'; lockEntered=''; lockTempPin=''; lockErr='';
      document.getElementById('lockRoot').innerHTML=''; showAppUI(true);
      toast('پن لاک آن ہو گیا'); render();
    }else{
      lockErr='پن میچ نہیں ہوا، دوبارہ کوشش کریں'; lockEntered=''; lockMode='setNew'; renderLockScreen();
    }
  }
}
function openSetPin(){
  lockTempPin='';
  if(DB.shop.pin){ lockMode='changeOld'; lockEntered=''; lockErr='موجودہ پن درج کریں'; }
  else{ lockMode='setNew'; lockEntered=''; lockErr='نیا پن منتخب کریں (4 ہندسے)'; }
  renderLockScreen();
}
async function removePin(){
  if(!(await customConfirm('پن لاک ہٹانا چاہتے ہیں؟'))) return;
  DB.shop.pin=''; saveDB(); toast('پن لاک ہٹا دیا گیا'); render();
}
function lockAppNow(){
  sessionStorage.removeItem(UNLOCK_KEY);
  lockMode='enter'; lockEntered=''; lockErr='';
  renderLockScreen();
}

/* ===================== INIT ===================== */
async function init(){
  await loadDB();
  go('dash');
  if(isLocked()){ lockMode='enter'; lockEntered=''; lockErr=''; renderLockScreen(); }
}
init();

/* ===================== OFFLINE (PWA) SUPPORT ===================== */
if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').then(function(reg){
      // If a new sw.js is deployed, activate it immediately instead of waiting
      reg.addEventListener('updatefound', function(){
        const nw = reg.installing;
        if(!nw) return;
        nw.addEventListener('statechange', function(){
          if(nw.state==='installed' && navigator.serviceWorker.controller){
            nw.postMessage({type:'SKIP_WAITING'});
          }
        });
      });
    }).catch(function(e){ console.error('SW register failed', e); });
  });
  let refreshing=false;
  navigator.serviceWorker.addEventListener('controllerchange', function(){
    if(refreshing) return; refreshing=true; window.location.reload();
  });
}
</script>
